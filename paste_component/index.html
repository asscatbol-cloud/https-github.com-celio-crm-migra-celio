<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: transparent;
    }
    .paste-container {
      border: 2px dashed #0066cc;
      background-color: #f4f8ff;
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      user-select: none;
    }
    .paste-container:hover, .paste-container:focus {
      background-color: #e6f0ff;
      border-color: #004499;
      outline: none;
    }
    .paste-icon {
      font-size: 26px;
      margin-bottom: 4px;
    }
    .paste-title {
      font-weight: 700;
      color: #0056b3;
      font-size: 14px;
    }
    .paste-subtitle {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }
    .status-area {
      margin-top: 6px;
      font-size: 12px;
    }
    .success-msg {
      color: #28a745;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="paste-container" id="pasteBox" tabindex="0">
    <div class="paste-icon">📋 📸</div>
    <div class="paste-title">Clique aqui e aperte <u>CTRL + V</u> para colar o Print</div>
    <div class="paste-subtitle">Tire um print (Win + Shift + S) e cole diretamente aqui</div>
    <div class="status-area" id="statusMsg"></div>
  </div>

  <script>
    function sendMessageToStreamlitClient(type, data) {
      var outData = Object.assign({
        isStreamlitMessage: true,
        type: type
      }, data);
      window.parent.postMessage(outData, "*");
    }

    function initStreamlit() {
      sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
      sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: 115});
    }

    function setComponentValue(value) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
    }

    const pasteBox = document.getElementById('pasteBox');
    const statusMsg = document.getElementById('statusMsg');

    pasteBox.addEventListener('paste', function(e) {
      e.preventDefault();
      var items = (e.clipboardData || e.originalEvent.clipboardData).items;
      var foundImage = false;

      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        if (item.type.indexOf("image") !== -1) {
          foundImage = true;
          var blob = item.getAsFile();
          var reader = new FileReader();

          statusMsg.innerHTML = '<span style="color:#0056b3">⏳ Processando imagem colada...</span>';

          reader.onload = function(event) {
            var base64String = event.target.result;
            statusMsg.innerHTML = '<span class="success-msg">✅ Print colado com sucesso!</span>';
            setComponentValue(base64String);
          };

          reader.readAsDataURL(blob);
          break;
        }
      }

      if (!foundImage) {
        statusMsg.innerHTML = '<span style="color:#dc3545;">⚠️ Nenhuma imagem encontrada no clipboard. Tire um print primeiro (Win + Shift + S) e tente novamente.</span>';
      }
    });

    pasteBox.addEventListener('click', function() {
      pasteBox.focus();
    });

    initStreamlit();
  </script>
</body>
</html>
